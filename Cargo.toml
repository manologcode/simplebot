[package]
name = "simplebot"
version = "0.1.0"
edition = "2021"
description = "Agente de administracion para Raspberry Pi y Orange Pi"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
regex = "1"
rpassword = "7"
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
