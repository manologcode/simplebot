name: build-release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Format, clippy and tests
        run: docker buildx build --target test --load -t simplebot:test --cache-from type=gha .

  build:
    name: Build multi-arch image and binaries
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # "linux/arm6" no es un platform valido; para Raspberry Pi/Orange Pi
          # de 64 bits el platform es linux/arm64.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export static binaries
        run: |
          rm -rf dist
          docker buildx build \
            --target artifacts \
            --platform linux/amd64 \
            --output type=local,dest=dist \
            --cache-from type=gha \
            .

      - name: Smoke test binaries
        run: |
          ./dist/out/simplebot-linux-amd64 --version
          docker run --rm --platform linux/arm64             -v "$PWD/dist/out:/dist:ro"             ubuntu:24.04 /dist/simplebot-linux-arm64 --version

      - name: Checksums
        run: |
          cd dist/out
          sha256sum simplebot-linux-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: simplebot-binaries
          path: |
            dist/out/simplebot-linux-amd64
            dist/out/simplebot-linux-arm64
            dist/out/SHA256SUMS

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/out/simplebot-linux-amd64
            dist/out/simplebot-linux-arm64
            dist/out/SHA256SUMS
